
name: Cambridge Crime ETL

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  run-etl:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify requirements file
        run: |
          python --version
          python -m pip --version
          cat requirements.txt

      - name: Install Psycopg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "psycopg[binary]"
          python -m pip show psycopg

      - name: Verify Psycopg import
        run: |
          python -c "import sys, psycopg; print('Python:', sys.executable); print('Psycopg version:', psycopg.__version__)"

      - name: Install remaining requirements
        run: python -m pip install -r requirements.txt

      - name: Verify Psycopg again
        run: python -c "import psycopg; print('Psycopg is available')"

      - name: Run Cambridge Crime ETL
        run: python -u etl.py

